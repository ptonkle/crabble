"web/nettest.js" = ["page", "online"]
"web/vendor/**" = ["page", "online"]
"tests/browser/online.py" = ["online"]
"tests/browser/online_game.py" = ["online"]
"scripts/check-online.sh" = ["online"]
"styles/**" = ["art"]
