# Test tags: which tests a change needs (Ape Race's quick check, as Honey
# Hole ported it to this template).
#
# scripts/quick-check.sh reads this file: changed files -> tags (through
# [sources]), then runs only the cargo tests, browser steps and other checks
# whose tags meet those (through [tests] and [browser]). scripts/check.sh
# still runs everything. `scripts/tags.py guard` (step 4 of check.sh) fails
# when a cargo test, a browser step or a tracked file is not classified here,
# when a key matches nothing (stale), or when a tag is not in [tags].
#
# A test carries every tag whose change could break it, not only its topic.
# When unsure, add the tag: an extra tag only costs time. Start a new tag only
# when a part of the game has tests of its own that other changes need not run.

[tags]
all = "foundations (the crate root, the shim, the build, Cargo files, the check and tag scripts): run everything"
boundary = "the Builder boundary tests: purity scanner, dependency allowlist, shim and page scans, CSP (always run: they scan every file)"
menus = "the screens the core describes (`ui`) and their flow through `act`: the Title and its entries, Local game, How to play, Settings, the pause menu and the end (api.rs, app.rs, app/*.rs, view.rs)"
whatsnew = "What's New: the version, the patch notes and their screen (patch_notes.rs, app/notes.rs, data/patch-notes.json, scripts/bump.sh)"
copy = "reader-visible words: data/strings.json, GLOSSARY.md, TONE.md, README.md, and the core's readers of them"
page = "the static page (web/) and the browser check's harness: every browser step runs"
standin = "the stand-in game until the real one is built: the crabs, the clock, the countdown, its picture (crates/core/src/standin/, tuning.rs, data/tuning.json, data/standin.json, web/standin.js)"
online = "online play: the protocol (crates/core/src/online/), the Online game screen and the Lobby (app/online_play.rs), the transport (web/online.js, web/net.js, web/vendor/) and scripts/check-online.sh with its browser checks"
art = "the art pipeline (tools/art/) and the style packs (styles/): tests/art_check.py"
notes = "the notebooks and other documents: the notebook form check only"
gfx = "the 3D drawing's core: fixed-point maths, geometry, the renderer and its shaders (gfx/, data/shaders/, web/gl.js). Hitting it hits models, scene and gallery too ([implies])"
models = "model files and their reader: data/models/, model.rs, tools/models/"
glyphs = "letters on tiles: glyph.rs, letters.rs, data/glyphs.json, tools/glyphs/"
look = "the water's light and the seat colours of the 3D view: look.rs, data/look.json"
scene = "stills placed from data and the word marks they draw: scene.rs, marks.rs, data/scenes/, scripts/shot.py"
gallery = "the Gallery screen and its own door: crates/core/src/gallery/, data/gallery.json, web/gallery.js, web/gallery.css"
sound = "the sounds: crates/core/src/sound/, data/sounds.json, web/audio.js, scripts/sounds.py, and the cues the stand-in names (app/play.rs)"
tooling = "scripts outside the check (serve, publish, audits, watch window): nothing beyond the always-run tests"

# Hitting a tag also hits these, for a tag whose change reaches another's
# tests: `a = ["b"]`.
[implies]
# the online game is the stand-in game, placed from other browsers
standin = ["online"]
# the Gallery draws models, scenes and glyphs through the renderer
gfx = ["models", "scene", "gallery"]
models = ["scene", "gallery"]
glyphs = ["scene", "gallery"]
look = ["scene", "gallery"]
scene = ["gallery"]

# Tags whose tests always run in a quick check.
[always]
tags = ["boundary"]

# ---------------------------------------------------------------------------
# Changed file -> tags. Globs over the repository path (`*` stays within one
# path segment, `**` crosses them). Every glob that matches adds its tags.
# A file that matches no glob runs everything; `[]` means run nothing for it.
# There is deliberately no catch-all for crates/core/src: a new module gets
# its own row (and its tests their own [tests] keys), or the guard fails.
[sources]
"Cargo.toml" = ["all"]
"Cargo.lock" = ["all"]
"rust-toolchain.toml" = ["all"]
"rustfmt.toml" = ["tooling"]
".gitignore" = ["tooling"]
"crates/core/Cargo.toml" = ["all"]
"crates/core/src/lib.rs" = ["all"]
"crates/shim/**" = ["all"]
"crates/core/src/api.rs" = ["menus"]
"crates/core/src/app.rs" = ["menus"]
"crates/core/src/app/title.rs" = ["menus"]
"crates/core/src/app/how.rs" = ["menus", "copy"]
"crates/core/src/app/local.rs" = ["menus", "standin"]
"crates/core/src/app/settings.rs" = ["menus"]
"crates/core/src/app/notes.rs" = ["whatsnew"]
"crates/core/src/app/play.rs" = ["menus", "standin", "sound"]
# the page's test flags, ?fast and ?short
"crates/core/src/app/fast.rs" = ["menus", "standin", "page"]
"crates/core/src/app/tests.rs" = ["menus"]
"crates/core/src/app/online_play.rs" = ["online", "menus"]
"crates/core/src/app/online_play/**" = ["online"]
"crates/core/src/view.rs" = ["menus"]
"crates/core/src/rng.rs" = ["standin", "online"]
"crates/core/src/standin/**" = ["standin"]
"crates/core/src/tuning.rs" = ["standin"]
"crates/core/src/online/**" = ["online"]
"crates/core/src/patch_notes.rs" = ["whatsnew"]
"crates/core/src/strings.rs" = ["copy"]
"crates/core/src/glossary.rs" = ["copy"]
"crates/core/tests/boundary.rs" = ["boundary"]
"crates/core/tests/copy.rs" = ["copy"]
"crates/core/tests/data_files.rs" = ["copy", "whatsnew", "standin", "models", "scene", "glyphs", "gallery", "sound"]
"crates/core/tests/no_storage.rs" = ["page"]
"data/strings.json" = ["copy"]
"data/patch-notes.json" = ["whatsnew"]
"data/tuning.json" = ["standin"]
"data/standin.json" = ["standin"]
"data/art.json" = ["art"]
"crates/core/src/gfx/**" = ["gfx"]
"crates/core/src/model.rs" = ["models"]
"crates/core/src/model/**" = ["models"]
"crates/core/src/glyph.rs" = ["glyphs"]
"crates/core/src/letters.rs" = ["glyphs"]
"crates/core/src/look.rs" = ["look"]
"crates/core/src/scene.rs" = ["scene"]
"crates/core/src/scene/**" = ["scene"]
"crates/core/src/marks.rs" = ["scene"]
"crates/core/src/marks/**" = ["scene"]
"crates/core/src/gallery/**" = ["gallery", "menus"]
"crates/core/src/testkit.rs" = ["models", "scene", "gallery", "gfx"]
"crates/core/src/sound/**" = ["sound"]
"crates/core/examples/write_sounds.rs" = ["sound"]
"crates/core/tests/sounds.rs" = ["sound"]
"data/models/**" = ["models", "copy"]
"data/scenes/**" = ["scene"]
"data/glyphs.json" = ["glyphs"]
"data/look.json" = ["look"]
"data/gallery.json" = ["gallery", "copy"]
"data/sounds.json" = ["sound", "copy"]
"data/shaders/**" = ["gfx"]
"web/gl.js" = ["page", "gfx"]
"web/gallery.js" = ["page", "gallery"]
"web/gallery.css" = ["page", "gallery"]
"web/audio.js" = ["page", "sound"]
"scripts/shot.py" = ["scene"]
"scripts/sounds.py" = ["sound"]
"tools/glyphs/**" = ["glyphs"]
"tools/models/**" = ["models"]
"web/**" = ["page"]
"web/standin.js" = ["page", "standin"]
"web/online.js" = ["page", "online"]
"web/online-config.js" = ["page", "online"]
"web/net.js" = ["page", "online"]
"web/net-clock.js" = ["page", "online"]
