"scripts/mutants.sh" = ["tooling"]
"scripts/break_tests.py" = ["tooling"]
"scripts/count-tests.sh" = ["tooling"]
"*.md" = ["notes"]
"README.md" = ["copy"]
"GLOSSARY.md" = ["copy"]
"TONE.md" = ["copy"]
"notes/**" = ["notes"]
"brief/**" = ["notes"]
".claude/**" = ["notes"]

# ---------------------------------------------------------------------------
# Line rules: a file takes these tags instead of its [sources] ones when every
# changed line of its diff matches one of the patterns (Python regular
# expressions). A release that only bumps VERSION in app.rs runs What's
# New's tests, not every menu test.
[lines]
"crates/core/src/app.rs" = { patterns = ['^pub const VERSION: &str = "[^"]*";$'], tags = ["whatsnew"] }

# Function -> tags, for a big file whose functions belong to different
# features: per file, Python regular expressions over the name of the
# outermost `fn` (or `def`) holding a changed line. Every matching regex
# adds its tags; a changed line in no named function takes the file's
# [sources] tags.
#   [functions."crates/core/src/app.rs"]
#   '^(escape|key)$' = ["keys"]
[functions]

# A changed line inside `def step_<name>` of this file runs that browser step
# only; any other line takes the file's [sources] tags (page: every step).
[steps]
"tests/browser/interactions.py" = '^step_(\w+)$'

# ---------------------------------------------------------------------------
# Cargo tests -> tags. A key is `<target>:<name prefix>`: `lib:` for the
# core's own tests by module path, `shim:` for the shim's, `test:<file>` for
# an integration test file (crates/core/tests/<file>.rs), optionally with
# `:<name prefix>`. The longest matching key wins.
[tests]
"lib:api::" = ["menus", "copy", "whatsnew"]
"lib:app::tests::" = ["menus", "copy", "standin", "whatsnew", "sound"]
"lib:app::online_play::" = ["online", "menus", "copy", "standin"]
"lib:glossary::" = ["copy"]
"lib:online::" = ["online"]
"lib:patch_notes::" = ["whatsnew"]
"lib:rng::" = ["standin", "online"]
"lib:standin::" = ["standin"]
"lib:strings::" = ["copy"]
"lib:tuning::" = ["standin"]
"lib:view::" = ["menus"]
"lib:gfx::" = ["gfx"]
"lib:model::" = ["models", "gfx"]
"lib:glyph::" = ["glyphs", "gfx"]
"lib:letters::" = ["glyphs"]
"lib:look::" = ["look"]
"lib:marks::" = ["scene", "look", "gfx"]
"lib:scene::" = ["scene", "models", "glyphs", "look", "gfx"]
"lib:gallery::" = ["gallery", "models", "scene", "glyphs", "look", "gfx", "copy"]
"lib:sound::" = ["sound"]
"lib:api::tests::sound" = ["sound"]
"test:sounds" = ["sound"]
"test:boundary" = ["boundary"]
"test:copy" = ["copy"]
"test:data_files" = ["copy", "whatsnew", "standin", "sound"]
"test:data_files:every_model" = ["models"]
"test:data_files:the_tile" = ["models"]
"test:data_files:the_glyphs" = ["glyphs"]
"test:data_files:every_scene" = ["scene", "models", "glyphs"]
"test:data_files:the_shipped_files" = ["gallery", "models", "scene", "glyphs", "look", "gfx"]
"test:no_storage" = ["page"]

# ---------------------------------------------------------------------------
# Browser steps (tests/browser/interactions.py STEPS) -> tags. The load and
# idle watch and the closing error and request checks run with every step.
[browser]
boot = ["menus", "copy", "whatsnew", "page"]
how = ["menus", "copy", "page"]
settings = ["menus", "copy", "page"]
notes = ["menus", "copy", "whatsnew", "page"]
local = ["menus", "copy", "page", "standin"]
end = ["menus", "copy", "page", "standin"]
online = ["menus", "copy", "page", "online"]
gallery = ["gallery", "models", "scene", "glyphs", "look", "gfx", "menus", "copy", "page"]
sounds = ["sound", "standin", "menus", "page"]
